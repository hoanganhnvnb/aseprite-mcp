[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aseprite-mcp"
version = "0.1.0"
description = "MCP server that lets AI assistants create and edit pixel art through the Aseprite editor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.6",
    "pydantic>=2.6",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
aseprite-mcp = "aseprite_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aseprite_mcp"]
include = ["src/aseprite_mcp/lua/**/*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "aseprite: needs a real Aseprite binary",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
